[project]
name = "opitz-wirtschaftsmathematik-phd-2026"
version = "0.1.0"
description = "From-textbook-to-live-market verification of Opitz/Etschberger/Burkart/Klein Mathematik (12th ed., Ch.27-30 + foundations). Reproducible PhD-grade benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Open Research Lab", email = "research@example.org" }]
dependencies = [
  "numpy==2.2.6",
  "scipy==1.16.2",
  "pandas==2.3.3",
  "matplotlib==3.10.6",
  "pytest==8.4.2",
]

[project.optional-dependencies]
dev = ["ruff==0.13.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
